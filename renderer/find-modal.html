<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find in Page</title>
  <link rel="stylesheet" href="./find-modal.css">
</head>
<body>
  <div class="row">
    <input id="term" aria-label="Find in page" type="text" placeholder="Find in page..." autofocus />
    <label><input id="match" type="checkbox"> Match case</label>
  </div>
  <div class="status-row">
    <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">No active search</div>
    <button id="cancel-indexing" aria-label="Cancel conversation indexing" hidden>Cancel</button>
  </div>
  <ul id="snippets" hidden></ul>
  <div class="actions">
    <button id="prev" aria-label="Previous match">Previous</button>
    <button id="next" aria-label="Next match">Next</button>
    <button id="clear" aria-label="Clear search highlights">Clear</button>
    <button id="close" aria-label="Close Find">Close</button>
  </div>
  <script src="./find-modal.js"></script>
</body>
</html>
