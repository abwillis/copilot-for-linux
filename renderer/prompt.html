<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rename</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 12px; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 4px; }
    input[type=text] { width: 100%; padding: 6px 8px; box-sizing: border-box; }
    .actions { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
    button { padding: 4px 12px; }
  </style>
</head>
<body>
  <label id="lbl">New name</label>
  <input id="term" type="text" autofocus />
  <div class="actions">
    <button id="cancel">Cancel</button>
    <button id="ok">Rename</button>
  </div>
  <script src="./prompt.js"></script>
</body>
</html>
